    title: Общая информация
    summary: |
      - Опытный Senior Java Developer с 9-летним опытом разработки сложных, высоконагруженных приложений и систем. 
      - Имею глубокие знания в области объектно-ориентированного программирования (ООП) и обширный опыт в проектировании и реализации распределённых систем. 
      - Эксперт в использовании фреймворков Spring, Hibernate, а также в микросервисной архитектуре и RESTful веб-сервисах. 
      - Успешно внедрял DevOps практики для обеспечения непрерывной интеграции и доставки (CI/CD), обладая достаточным уровнем понимания инструментов Docker и Kubernetes. 
      - Обладаю отличными коммуникативными и лидерскими навыками, что позволяет эффективно работать в команде и управлять проектами от этапа планирования до внедрения.
      - Предпочтительней удаленная работа.
      
